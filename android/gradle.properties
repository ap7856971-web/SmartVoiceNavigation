# ============================================================
# PROJECT-WIDE GRADLE SETTINGS
# ============================================================

# ------------------------------------------------------------
# GRADLE JVM MEMORY
# ------------------------------------------------------------
# 6 GB heap available for Gradle.
# MaxMetaspaceSize controls JVM metadata memory.
#
# IMPORTANT:
# Do not increase this further unless your PC has plenty of RAM.
# ------------------------------------------------------------

org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8


# ------------------------------------------------------------
# GRADLE PERFORMANCE
# ------------------------------------------------------------
# Parallel build can increase RAM usage.
# Your previous failure was Java heap exhaustion during
# packageDebug, so keep parallel execution disabled.
# ------------------------------------------------------------

org.gradle.parallel=false

# Limit simultaneous Gradle workers to reduce memory pressure.
org.gradle.workers.max=2


# ------------------------------------------------------------
# ANDROIDX
# ------------------------------------------------------------

android.useAndroidX=true


# ------------------------------------------------------------
# ANDROID BUILD
# ------------------------------------------------------------

android.enablePngCrunchInReleaseBuilds=true


# ------------------------------------------------------------
# REACT NATIVE ARCHITECTURES
# ------------------------------------------------------------
# Keep all architectures supported by the project.
#
# For a physical ARM Android phone, you can build only arm64 later
# to make builds/APKs smaller.
# ------------------------------------------------------------

reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64


# ------------------------------------------------------------
# REACT NATIVE NEW ARCHITECTURE
# ------------------------------------------------------------

newArchEnabled=true


# ------------------------------------------------------------
# HERMES
# ------------------------------------------------------------

hermesEnabled=true


# ------------------------------------------------------------
# EDGE TO EDGE
# ------------------------------------------------------------

edgeToEdgeEnabled=true


# ------------------------------------------------------------
# EXPO IMAGE SUPPORT
# ------------------------------------------------------------

expo.gif.enabled=true

expo.webp.enabled=true

expo.webp.animated=false


# ------------------------------------------------------------
# EXPO DEVELOPMENT CLIENT
# ------------------------------------------------------------

EX_DEV_CLIENT_NETWORK_INSPECTOR=true


# ------------------------------------------------------------
# EXPO NATIVE LIBRARY PACKAGING
# ------------------------------------------------------------

expo.useLegacyPackaging=false


# ------------------------------------------------------------
# EXPO INLINE MODULES
# ------------------------------------------------------------

expo.inlineModules.watchedDirectories=[]